name: Release Notes

# Fires after release.yml (Section 1B) publishes the GitHub Release for a
# vX.Y.Z tag. Publishes a Confluence page combining the human-written
# CHANGELOG.md entry with a live Jira-issues smart-link over the tickets
# referenced in the commits since the previous release — Confluence queries
# Jira directly to render that table, so it never goes stale.
#
# workflow_dispatch exists only to validate Atlassian credentials and the
# composed page against an existing tag without waiting for (or faking) a
# real release. It hits the same real APIs and creates a real Confluence
# page — it is a manual test hook, not a dry run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to run this for (manual test only, publishes a real Confluence page)"
        required: true
        type: string

concurrency:
  group: release-notes-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish-release-notes:
    name: Publish release notes to Confluence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Need full tag history to find the previous release by semver, and
          # the CHANGELOG.md content as it existed at this tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve current and previous release tag
        id: tags
        run: |
          CURRENT_TAG="${{ github.event.release.tag_name || inputs.tag }}"

          # Semver sort (not chronological) so a late-published/backfilled
          # release doesn't get compared against the wrong neighbour.
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | awk -v cur="$CURRENT_TAG" '
            found { print; exit }
            $0 == cur { found=1 }
          ')

          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found; treating $CURRENT_TAG as the first release."
          else
            echo "Diffing $PREVIOUS_TAG..$CURRENT_TAG"
          fi

      - name: Extract Jira ticket keys from commit range
        id: tickets
        run: |
          CURRENT_TAG="${{ steps.tags.outputs.current_tag }}"
          PREVIOUS_TAG="${{ steps.tags.outputs.previous_tag }}"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
          else
            RANGE="$CURRENT_TAG"
          fi

          git log "$RANGE" --pretty=format:"%s" > /tmp/commit-subjects.txt

          TICKET_KEYS=$(grep -ohE 'DEB-[0-9]+' /tmp/commit-subjects.txt | sort -u -t- -k2,2n | paste -sd, -)

          echo "keys=$TICKET_KEYS" >> "$GITHUB_OUTPUT"
          echo "Tickets referenced since $PREVIOUS_TAG: ${TICKET_KEYS:-(none)}"

      - run: npm ci

      - name: Compose and publish release notes
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          # Qualifies the release page's title (e.g. "Front-End Release
          # v1.2.0") so it stays unique inside the shared "📓 Release Notes"
          # page — see CONTRIBUTING.md. Not a secret, just this repo's name.
          CONFLUENCE_PROJECT_PAGE: "Front-End"
          RELEASE_TAG: ${{ steps.tags.outputs.current_tag }}
          TICKET_KEYS: ${{ steps.tickets.outputs.keys }}
        run: node scripts/publish-release-notes.mjs
